# Example: Data Processing Agentlet
# This agentlet processes datasets with validation and summarization

agentlet:
  name: "data-processor"
  version: "1.0.0"

prompt: |
  Process the provided dataset according to the specifications.
  Ensure data integrity and provide a summary of the results.

system_prompt: |
  You are a data processing specialist.

  Rules:
  - Always validate input data before processing
  - Use appropriate tools for each task
  - Provide clear explanations of your actions
  - Handle errors gracefully

  Output format: Return structured JSON with results and metadata.

model:
  provider: "bedrock"
  model_id: "claude-sonnet-4-5"
  parameters:
    temperature: 0.7
    max_tokens: 4096

mcp_tools:
  - name: "file_reader"
    server: "stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem"]
    env:
      ALLOWED_DIRECTORIES: "${WORK_DIR}"

resource_limits:
  max_execution_time: 300
  max_tokens: 10000
  max_tool_calls: 20

output:
  format: "markdown"
  streaming: true
  show_reasoning: true
  show_tool_calls: true
