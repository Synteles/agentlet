# Example agentlet configuration with multiple MCP transport types
# This demonstrates combining stdio, HTTP, and SSE MCP servers in one agentlet

agentlet:
  name: "mcp-mixed-example"
  description: "Example agentlet using multiple MCP transport types"

model:
  provider: "bedrock"
  model_id: "claude-sonnet-4-5"
  parameters:
    temperature: 0.7
    top_p: 0.9

# MCP Tools Configuration - Multiple transport types
mcp_tools:
  # stdio: Local filesystem access
  - name: "filesystem"
    server: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
    env:
      ALLOWED_DIRECTORIES: "${WORK_DIR}"
    prefix: "fs"
    tool_filters:
      allowed:
        - "read_file"
        - "write_file"
        - "list_directory"

  # HTTP: External API service
  - name: "weather-api"
    server: "http"
    url: "https://api.weather-service.com/mcp/"
    api_key_env: "WEATHER_API_KEY"
    headers:
      X-Client-Id: "agentlet-core"
    prefix: "weather"

  # SSE: Real-time updates
  - name: "notifications"
    server: "sse"
    url: "http://localhost:9000/notifications/sse"
    prefix: "notify"
    tool_filters:
      rejected:
        - "admin_tool"

# Default Strands tools (combined with MCP tools)
tools:
  - "bash"
  - "file_editor"
  - "computer"

system_prompt: |
  You are a powerful AI assistant with access to multiple tool sources:
  - Local filesystem operations (stdio)
  - Weather API service (HTTP)
  - Real-time notification system (SSE)
  - Standard bash, file editing, and computer control tools

  Use the appropriate tools to complete user requests efficiently.

prompt: "Check the weather and create a file with today's forecast."

resource_limits:
  max_execution_time: 600
  max_tokens: 15000
  max_tool_calls: 30

output:
  format: "markdown"
  show_reasoning: true
  show_tool_calls: true
