name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run all checks
        run: |
          make check

  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel and sdist
        run: |
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  build-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=$(echo ${VERSION} | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo ${VERSION} | cut -d. -f1-2)" >> $GITHUB_OUTPUT
          # Detect pre-release: PEP 440 (0.1.0a1, 0.1.0b1, 0.1.0rc1) or conventional (0.1.0-alpha, 0.1.0-beta, 0.1.0-rc)
          if echo "$VERSION" | grep -qE '[0-9](a|b|rc)[0-9]|-(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute Docker tags
        id: docker_tags
        env:
          REPO: synteles/agentlet
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          TAGS="${REPO}:${VERSION}
          ${REPO}:edge"
          if [ "$PRERELEASE" == "false" ]; then
            TAGS="${TAGS}
          ${REPO}:${MAJOR}
          ${REPO}:${MINOR}
          ${REPO}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: synteles/agentlet
          short-description: "Agentlet Core - Autonomous AI agent runtime"
          readme-filepath: ./README.md
        continue-on-error: true

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-python, build-push-docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -qE '[0-9](a|b|rc)[0-9]|-(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## Changes since ${PREVIOUS_TAG}" > release_notes.md
            echo "" >> release_notes.md
            git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
            echo "" >> release_notes.md
            echo "First release of Agentlet Core!" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Docker (Recommended)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker pull synteles/agentlet:${{ steps.version.outputs.version }}" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Python Package from GitHub Release" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "# Download the wheel file from release assets, then:" >> release_notes.md
          echo "pip install agentlet_core-${{ steps.version.outputs.version }}-py3-none-any.whl" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Direct from Git" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "pip install git+https://github.com/Synteles/agentlet.git@v${{ steps.version.outputs.version }}" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Download Python package artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build-python, build-push-docker, create-github-release]
    if: always()

    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Release v${{ steps.version.outputs.version }} Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-python.result }}" == "success" ]; then
            echo "✅ **Python Package**: Built successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - Wheel and sdist attached to GitHub Release" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Python Package**: Build failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-push-docker.result }}" == "success" ]; then
            echo "✅ **Docker Hub**: Published successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - \`docker pull synteles/agentlet:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "   - Platforms: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Docker Hub**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.create-github-release.result }}" == "success" ]; then
            echo "✅ **GitHub Release**: Created successfully" >> $GITHUB_STEP_SUMMARY
            echo "   - Python packages available as release assets" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **GitHub Release**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: PyPI publishing is disabled. Distribution via Docker Hub and GitHub Releases only." >> $GITHUB_STEP_SUMMARY
