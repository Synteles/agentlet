name: PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run ruff linting
        run: |
          uv run ruff check .
        if: success() || failure()

      - name: Check code formatting
        run: |
          uv run ruff format --check .
        if: success() || failure()

      - name: Run type checking
        run: |
          uv run mypy agentlet_core
        if: success() || failure()

      - name: Run security checks
        run: |
          uv run bandit -r agentlet_core/ -ll
        if: success() || failure()

      - name: Run tests with coverage
        run: |
          uv run pytest -v --cov=agentlet_core --cov-report=xml --cov-report=term --cov-fail-under=85
        if: success() || failure()

      - name: Upload coverage to artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
        continue-on-error: true

  docker-build-amd64:
    name: Docker Build & Scan (amd64)
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: agentlet-core:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table --ignorefile .trivyignore agentlet-core:pr-test

      - name: Generate Trivy SARIF report
        if: always()
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --format sarif --output trivy-results.sarif --ignorefile .trivyignore agentlet-core:pr-test

      - name: Upload Trivy SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
        continue-on-error: true

  docker-build-arm64:
    name: Docker Build (arm64)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker image (arm64)
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks secret scan
        run: |
          gitleaks detect --source . --log-opts="--all" --config .gitleaks.toml --verbose
